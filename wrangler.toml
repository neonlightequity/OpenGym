# Cloudflare deployment of openGym at gym.davidovichequity.com (fork-owned; see CLOUDFLARE.md).
# Build the frontend first (npm run cf:build), then `npx wrangler deploy`.
name = "opengym"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# custom_domain creates the proxied DNS record and certificate on the davidovichequity.com zone.
routes = [
  { pattern = "gym.davidovichequity.com", custom_domain = true }
]

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# The whole API is one Durable Object (cloudflare/server-do.js); its SQLite storage holds what
# ./data holds on a Docker install: db.json, state-<uid>.json, secret, vapid.json, audit.log.
[[durable_objects.bindings]]
name = "OPENGYM"
class_name = "OpenGymServer"

# Backups of the Durable Object's data (cloudflare/backup.js). Private bucket, never public.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "opengym-backups"

[triggers]
crons = ["17 3 * * *"]   # daily backup, 03:17 UTC

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OpenGymServer"]

# The Workers build swaps the npm web-push (node:https) for a WebCrypto + fetch implementation.
[alias]
"web-push" = "./cloudflare/web-push.js"

# Bundled modules have no import.meta.url; the coach adapters read it at import (createRequire)
# even though the coach is off. Any absolute file URL satisfies them.
[define]
"import.meta.url" = "\"file:///opengym/worker.js\""

# api/server.js configuration (docs/SELF_HOSTING.md has the full contract). Local overrides go in
# .dev.vars (see .dev.vars.example); secrets never go here.
[vars]
RP_ID = "gym.davidovichequity.com"
RP_NAME = "openGym"
ORIGIN = "https://gym.davidovichequity.com"
VAPID_SUBJECT = "https://gym.davidovichequity.com"
TRUST_PROXY = "1"
# The owner's profile (admin dashboard, invite codes). New profiles need an invite code.
ADMIN_UIDS = "ROFl0cz7ERY2iHBg"
INVITE_ONLY = "1"
# The AI Coach runs a local agent process; there is none on Workers.
COACH_DISABLED = "1"
# Custom-exercise photos/videos: stored in the Durable Object (cloudflare/do-fs.js), mirrored to
# R2 nightly. An upload is held in memory whole in a 128 MB isolate, so videos are capped below
# upstream's 40 MB default; the app reads the caps from /api/config.
MEDIA_UPLOADS = "on"
MEDIA_VIDEO_MAX_MB = "16"

[observability]
enabled = true
